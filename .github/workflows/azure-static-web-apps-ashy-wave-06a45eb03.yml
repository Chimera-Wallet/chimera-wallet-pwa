name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
      - beta
      - staging
  # PRs are built as a check but never deployed: deploying a pull_request
  # event makes Azure create a preview environment per PR. Only the three
  # long-lived branches get an environment, on push.
  pull_request:
    branches:
      - master
      - beta
      - staging

# The branch being deployed: the pushed branch, or a PR's target branch.
env:
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # Full history for git-info

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: |
          case "$TARGET_BRANCH" in
            master|main)
              MODE=production
              ;;
            beta)
              # A production build with only .env.beta's overrides on top:
              # exported vars take precedence over Vite's .env files, so beta
              # can't drift from what ships.
              MODE=production
              set -a
              source .env.beta
              set +a
              ;;
            staging)
              MODE=staging
              ;;
            *)
              echo "No build mode for branch '$TARGET_BRANCH'" >&2
              exit 1
              ;;
          esac
          pnpm git-info
          pnpm exec vite build -c vite.worker.config.ts --mode $MODE
          pnpm exec vite build --mode $MODE

      - name: Install API dependencies
        run: npm install
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Deploy to Azure Static Web Apps
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_WAVE_06A45EB03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true   # We already built above
          production_branch: "master"
